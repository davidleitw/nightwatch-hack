[project]
name = "nightwatch-agent"
version = "0.1.0"
description = "Minimal NightWatch investigation loop"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=2.43,<3",
    "jsonschema>=4.23,<5",
]

[project.scripts]
nightwatch-agent = "nightwatch_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightwatch_agent", "monitor"]
